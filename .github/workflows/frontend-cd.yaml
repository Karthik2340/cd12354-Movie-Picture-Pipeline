name: Frontend Continuous Deployment

on:
  push:
    branches:
      - main
    paths:
      - 'starter/frontend/**'
      - '.github/workflows/frontend-cd.yaml'
  workflow_dispatch:

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: starter/frontend
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup NodeJS
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Perform a cache action to restore cache before dependency install
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('starter/frontend/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install dependencies
        run: npm ci

      - name: Run the npm run lint command
        run: npm run lint

  test:
    name: Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: starter/frontend
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup NodeJS
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Perform a cache action to restore cache before dependency install
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('starter/frontend/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install dependencies
        run: npm ci

      - name: Run the npm run test command
        run: npm run test
        env:
          CI: true

  build-and-deploy:
    name: Build and Deploy
    needs: [lint, test]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_DEFAULT_REGION || 'us-east-1' }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Kustomize
        uses: imranismail/setup-kustomize@v2

      - name: Build the application using docker
        working-directory: starter/frontend
        run: |
          MOVIE_API_URL="${{ secrets.REACT_APP_MOVIE_API_URL }}"
          if [ -z "$MOVIE_API_URL" ]; then
            # Attempt to discover backend service URL from cluster if available
            aws eks update-kubeconfig --region ${{ secrets.AWS_DEFAULT_REGION || 'us-east-1' }} --name ${{ secrets.CLUSTER_NAME || 'cluster' }} || true
            MOVIE_API_URL=$(kubectl get svc backend -o jsonpath='{.status.loadBalancer.ingress[0].hostname}' 2>/dev/null || echo "http://localhost:5000")
            if [ -n "$MOVIE_API_URL" ] && [[ ! "$MOVIE_API_URL" =~ ^http ]]; then
              MOVIE_API_URL="http://$MOVIE_API_URL"
            fi
          fi
          echo "Building with REACT_APP_MOVIE_API_URL=${MOVIE_API_URL}"
          docker build \
            --build-arg REACT_APP_MOVIE_API_URL="${MOVIE_API_URL}" \
            --tag ${{ steps.login-ecr.outputs.registry }}/frontend:${{ github.sha }} \
            .

      - name: Push docker image to Amazon ECR
        run: |
          docker push ${{ steps.login-ecr.outputs.registry }}/frontend:${{ github.sha }}

      - name: Deploy application using kubectl to the EKS cluster
        working-directory: starter/frontend/k8s
        run: |
          aws eks update-kubeconfig --region ${{ secrets.AWS_DEFAULT_REGION || 'us-east-1' }} --name ${{ secrets.CLUSTER_NAME || 'cluster' }}
          kustomize edit set image frontend=${{ steps.login-ecr.outputs.registry }}/frontend:${{ github.sha }}
          kustomize build . | kubectl apply -f -
